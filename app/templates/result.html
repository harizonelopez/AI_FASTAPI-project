<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Prediction Result</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

        <!-- Custom result page styling -->
        <link href="/static/css/result-style.css" rel="stylesheet">

        <style>
            .prediction-card {
                background-color: #1e1e1e;
                border-radius: 12px;
                padding: 1.5rem;
                box-shadow: 0 0 15px rgba(0, 255, 100, 0.08);
            }
            .progress {
                height: 26px;
                border-radius: 8px;
                background-color: #2c2c2c;
            }
            .rank-badge {
                width: 32px;
                height: 32px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                font-weight: bold;
                margin-right: 10px;
            }
        </style>
    </head>
    <body class="bg-dark text-white">

        <div class="container mt-5 mb-5">
            <div class="prediction-card mx-auto" style="max-width: 650px;">

                <h2 class="text-success mb-4 text-center">
                    <i class="bi bi-cpu"></i> Prediction Results
                </h2>

                <!-- Uploaded Image -->
                <div class="text-center mb-4">
                    <img src="{{ image_url }}" 
                        alt="Uploaded Image" 
                        class="img-fluid rounded"
                        style="max-width: 320px; border: 2px solid #333;">
                </div>

                <!-- Top 3 Predictions -->
                <h5 class="mb-3 text-info">
                    <i class="bi bi-bar-chart-fill"></i> Top 3 Predictions
                </h5>

                {% for pred in predictions %}
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <div>
                                {% if loop.index == 1 %}
                                    <span class="rank-badge bg-success text-dark">1</span>
                                {% elif loop.index == 2 %}
                                    <span class="rank-badge bg-primary">2</span>
                                {% else %}
                                    <span class="rank-badge bg-secondary">3</span>
                                {% endif %}

                                <strong>{{ pred.label }}</strong>
                            </div>
                            <span class="fw-bold">{{ pred.confidence }}%</span>
                        </div>

                        <div class="progress">
                            <div class="progress-bar progress-bar-striped progress-bar-animated
                                {% if loop.index == 1 %}bg-success
                                {% elif loop.index == 2 %}bg-info
                                {% else %}bg-secondary
                                {% endif %}"
                                role="progressbar"
                                style="width: 0%;"
                                aria-valuenow="{{ pred.confidence }}"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                data-confidence="{{ pred.confidence }}">
                                {{ pred.confidence }}%
                            </div>
                        </div>
                    </div>
                {% endfor %}

                <!-- Buttons -->
                <div class="text-center mt-5">
                    <a href="/" class="btn btn-outline-success btn-lg">
                        <i class="bi bi-arrow-repeat"></i> Try Another Image
                    </a>
                </div>

            </div>
        </div>

        <!-- Animate progress bars -->
        <script>
            window.addEventListener('DOMContentLoaded', () => {
                const bars = document.querySelectorAll('.progress-bar');
                bars.forEach(bar => {
                    const confidence = bar.getAttribute('data-confidence');
                    setTimeout(() => {
                        bar.style.transition = 'width 1.3s ease-out';
                        bar.style.width = confidence + '%';
                    }, 200);
                });
            });
        </script>

        <!-- Bootstrap tooltips -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
            const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
        </script>

    </body>
</html>
